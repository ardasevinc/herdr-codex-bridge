id = "herdr-codex-bridge"
name = "Herdr Codex Bridge"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Restores native Herdr pane identity to Codex sessions using a centralized app-server"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/install-plugin-worker.sh"]

[[events]]
on = "pane.agent_detected"
command = ["bin/herdr-self", "_watch"]

# SessionStart can replace the thread inside an existing Codex process after
# /clear. The next prompt changes agent status, providing a fresh one-shot
# watcher without keeping a pane-lifetime plugin process resident.
[[events]]
on = "pane.agent_status_changed"
command = ["bin/herdr-self", "_watch"]
